# Railway deploy config (tiêu chí 12)
# PORT do Railway cấp, Dockerfile CMD đọc ${PORT:-8000}.
# Secret đặt bằng CLI/Dashboard: railway variables set AGENT_API_KEY=...
# Redis: thêm plugin Redis rồi đặt REDIS_URL=${{Redis.REDIS_URL}}

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
